name: Build preconfigured Android support client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {abi: arm64-v8a, target: aarch64-linux-android, platform: android-arm64, script: ndk_arm64.sh, triple: aarch64-linux-android}
          - {abi: armeabi-v7a, target: armv7-linux-androideabi, platform: android-arm, script: ndk_arm.sh, triple: arm-linux-androideabi}
          - {abi: x86_64, target: x86_64-linux-android, platform: android-x64, script: ndk_x64.sh, triple: x86_64-linux-android}
    env:
      CARGO_BUILD_JOBS: '2'
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_MAX_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: rustdesk/rustdesk
          ref: 6c578292e8ebbbec708b76986ba8c4bc7c509747
          submodules: recursive
          path: source
          persist-credentials: false
      - name: Apply reviewed customization
        run: python3 gd/prepare.py source
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib g++-multilib libayatana-appindicator3-dev libasound2-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build pkg-config
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Apply upstream Flutter patch
        run: git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/source/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75'
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: source
          key: gd-android-${{ matrix.abi }}
          cache-on-failure: true
      - name: Generate Flutter Rust bridge
        working-directory: source
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          cd flutter
          flutter pub get
          cd ..
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Prepare pinned native dependency builder
        run: |
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 120deac3062162151622ca4860575a33844ba10b
          git -C "$VCPKG_ROOT" checkout --detach FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/vcpkg/archives
          key: gd-vcpkg-r28c-${{ matrix.abi }}-${{ hashFiles('source/vcpkg.json', 'source/vcpkg-configuration.json') }}
      - name: Build native libraries
        working-directory: source
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          ./flutter/build_android_deps.sh '${{ matrix.abi }}'
          cargo install cargo-ndk --version 3.1.2 --locked
          ./flutter/${{ matrix.script }}
          mkdir -p flutter/android/app/src/main/jniLibs/${{ matrix.abi }}
          cp target/${{ matrix.target }}/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/${{ matrix.abi }}/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.triple }}/libc++_shared.so" flutter/android/app/src/main/jniLibs/${{ matrix.abi }}/
      - name: Build unsigned release APK
        working-directory: source/flutter
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' android/gradle.properties
          flutter build apk --release --target-platform '${{ matrix.platform }}' --split-per-abi --build-name=1.4.9-gd.1 --build-number=1001
      - name: Package APK and corresponding source
        env:
          GD_BUILD_COMMIT: ${{ github.sha }}
          GD_BUILD_RUN: ${{ github.run_id }}
          GD_BUILD_ABI: ${{ matrix.abi }}
        run: python3 gd/package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gd-support-${{ matrix.abi }}
          path: artifacts/*
          retention-days: 30
